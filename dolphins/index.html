<link rel="stylesheet" href="../engine/engine.css">
<style>
  html, body { background: #3b1d6e; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  /* Jump counter, top left (the shared parts are in engine.css) */
  #counter {
    gap: 6px;
    padding: 4px 16px 4px 6px;
    background: rgba(37, 16, 79, 0.45);
    color: #ffe3a0;
  }
  #counter canvas { position: static; width: 48px; height: 36px; }
  #counter.party { color: #fff; background: rgba(224, 80, 143, 0.7); }
</style>

<body>
<canvas id="scene"></canvas>
<div id="counter" role="status" aria-label="Jumps"><canvas id="counter-icon" width="96" height="72"></canvas><span id="count">0</span></div>

<script type="module">
  import { startGame, keepAwake, fitCanvas } from '../engine/core.js';
  import { audio, noiseBuf, ensureAudio, tone, vary } from '../engine/audio.js';
  import { createParty } from '../engine/party.js';

  startGame();

  let W = 0, H = 0, seaY = 0, waterY = 0, size = 0;
  const ctx = fitCanvas(document.getElementById('scene'), (w, h) => {
    W = w; H = h;
    seaY = H * 0.56;            // horizon
    waterY = seaY + H * 0.11;   // where the dolphins dive in and out
    size = Math.min(W, H) * 0.46; // dolphin length in pixels
  });

  // ---------- Sound (helpers are in engine/audio.js) ----------
  function chirp() {
    if (!audio) return;
    const t = audio.currentTime;
    const osc = audio.createOscillator(), g = audio.createGain();
    osc.type = 'sine';
    const base = 900 + Math.random() * 300;
    osc.frequency.setValueAtTime(base, t);
    osc.frequency.exponentialRampToValueAtTime(base * 2.3, t + 0.14);
    osc.frequency.exponentialRampToValueAtTime(base * 1.5, t + 0.30);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.12, t + 0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.34);
    osc.connect(g).connect(audio.destination);
    osc.start(t); osc.stop(t + 0.4);
  }
  function splashSound(vol) {
    if (!audio || !noiseBuf) return;
    const t = audio.currentTime;
    const src = audio.createBufferSource(); src.buffer = noiseBuf;
    const f = audio.createBiquadFilter(); f.type = 'bandpass';
    f.frequency.setValueAtTime(1800, t);
    f.frequency.exponentialRampToValueAtTime(500, t + 0.4);
    f.Q.value = 0.8;
    const g = audio.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.45);
    src.connect(f).connect(g).connect(audio.destination);
    src.start(t); src.stop(t + 0.5);
  }

  // Small, soft "plop" for a dolphin popping its head up: a short burst of
  // splashy noise with a gentle falling bloop underneath
  function plopSound(vol) {
    if (!audio || !noiseBuf) return;
    const t = audio.currentTime;
    const src = audio.createBufferSource(); src.buffer = noiseBuf;
    const f = audio.createBiquadFilter(); f.type = 'bandpass';
    f.frequency.setValueAtTime(2600, t);
    f.frequency.exponentialRampToValueAtTime(900, t + 0.2);
    f.Q.value = 1.2;
    const g = audio.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    src.connect(f).connect(g).connect(audio.destination);
    src.start(t); src.stop(t + 0.25);

    const osc = audio.createOscillator(), og = audio.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(520, t);
    osc.frequency.exponentialRampToValueAtTime(180, t + 0.12);
    og.gain.setValueAtTime(0.0001, t);
    og.gain.exponentialRampToValueAtTime(vol * 0.8, t + 0.01);
    og.gain.exponentialRampToValueAtTime(0.0001, t + 0.14);
    osc.connect(og).connect(audio.destination);
    osc.start(t); osc.stop(t + 0.16);
  }

  // The pink dolphin's own happy trill as she bursts out of the water: two
  // quick rising squeaks, higher than the others, with a little sparkle on top
  function happyTrill() {
    if (!audio) return;
    const f = vary(1400, 0.15);
    tone('sine', f, f * 1.5, 0, 0.12, 0.13);
    tone('sine', f * 1.25, f * 2, 0.13, 0.2, 0.13);
    tone('triangle', f * 3, f * 3.02, 0.08, 0.35, 0.03);
  }

  // ---------- Dolphins ----------
  const SKINS = [
    { top: '#8a5bd8', belly: '#e2cffa', fin: '#6f43bd' },
    { top: '#a678ee', belly: '#efe0ff', fin: '#8456d4' },
    { top: '#7d4fcf', belly: '#d9c2f6', fin: '#613aae' },
    { top: '#b98cf5', belly: '#f4e9ff', fin: '#9467e0' },
  ];
  // The special pink dolphin. A brighter bubblegum pink than the sunset, with
  // a pale belly, so she stands out against the pink sky.
  const PINK = { top: '#ff8fcf', belly: '#ffe8f5', fin: '#f060ad' };
  const PINK_CHANCE = 0.2;        // about one tapped jump in five...
  const PINK_AT_LEAST_EVERY = 7;  // ...and never more than this many apart
  let sincePink = 0;

  function bodyPath(c) {
    c.beginPath();
    c.moveTo(102, 1);
    c.bezierCurveTo(90, -5, 76, -20, 50, -25);       // beak up to forehead
    c.bezierCurveTo(20, -33, -25, -30, -60, -13);    // back
    c.bezierCurveTo(-78, -5, -88, 0, -98, 3);        // tail stock
    c.lineTo(-124, -14);                             // upper fluke
    c.quadraticCurveTo(-108, 2, -106, 8);            // notch
    c.quadraticCurveTo(-110, 16, -122, 28);          // lower fluke
    c.lineTo(-96, 13);
    c.bezierCurveTo(-60, 22, -10, 28, 30, 20);       // belly
    c.bezierCurveTo(58, 15, 82, 9, 98, 5);           // chin to beak
    c.closePath();
  }

  function drawDolphin(c, skin, flap) {
    // tail-flap: gentle wiggle of the back half
    c.save();
    // dorsal fin
    c.fillStyle = skin.fin;
    c.beginPath();
    c.moveTo(12, -31); c.quadraticCurveTo(-4, -56, -30, -60); c.quadraticCurveTo(-22, -40, -36, -24); c.closePath();
    c.fill();
    // body
    const g = c.createLinearGradient(0, -32, 0, 28);
    g.addColorStop(0, skin.top); g.addColorStop(0.55, skin.top); g.addColorStop(0.62, skin.belly); g.addColorStop(1, skin.belly);
    bodyPath(c);
    c.fillStyle = g; c.fill();
    // golden-hour rim light along the back
    c.lineWidth = 2.2; c.strokeStyle = 'rgba(255,196,120,0.65)';
    c.beginPath();
    c.moveTo(90, -6); c.bezierCurveTo(76, -20, 62, -22, 50, -25); c.bezierCurveTo(20, -33, -25, -30, -60, -13);
    c.stroke();
    // flipper
    c.fillStyle = skin.fin;
    c.beginPath();
    c.moveTo(30, 16); c.quadraticCurveTo(16, 40, -12, 46); c.quadraticCurveTo(0, 28, 6, 18); c.closePath();
    c.fill();
    // smile
    c.strokeStyle = 'rgba(60,20,100,0.55)'; c.lineWidth = 1.8; c.lineCap = 'round';
    c.beginPath(); c.moveTo(98, 4); c.quadraticCurveTo(80, 8, 64, 3); c.stroke();
    // eye
    c.fillStyle = '#2a1050'; c.beginPath(); c.arc(62, -8, 4.2, 0, 6.3); c.fill();
    c.fillStyle = '#fff'; c.beginPath(); c.arc(63.4, -9.4, 1.4, 0, 6.3); c.fill();
    c.restore();
  }

  // small dolphin next to the jump counter
  (() => {
    const ic = document.getElementById('counter-icon').getContext('2d');
    ic.translate(48, 40); ic.rotate(-0.25); ic.scale(0.34, 0.34);
    drawDolphin(ic, SKINS[1], 0);
  })();

  const dolphins = [];
  const peeks = [];     // dolphins popping their heads out of the water
  const confetti = [];  // party confetti

  // ---------- Jump counter and party (shared parts in engine/party.js) ----------
  const PARTY_AT = 20;      // jumps needed for a party
  const PARTY_LENGTH = 3;   // seconds
  let nextLeap = 0;
  const party = createParty({
    goal: PARTY_AT,
    length: PARTY_LENGTH,
    fanfareVolume: 0.14,
    onStart() {
      nextLeap = 0;
      addConfetti(140, true);
      addConfetti(60, false);
    },
    onUpdate(dt, t) {
      nextLeap -= dt;
      // a dolphin leaps every 0.12 seconds, all along the sea
      if (t < PARTY_LENGTH - 0.6 && nextLeap <= 0) {
        leap(W * (0.05 + Math.random() * 0.9), size * (0.7 + Math.random() * 1.1), true);
        nextLeap = 0.12;
      }
      if (t < 1.5 && Math.random() < 0.5) addConfetti(3, true);
    },
    text: {
      y: 0.3, size: 0.16, stroke: '#3b1d6e', flash: '255,240,220',
      // shimmering sunset colours
      fill(c, fs, t) {
        const g = c.createLinearGradient(-fs * 1.5, 0, fs * 1.5, 0);
        const shift = (t * 120) % 360;
        g.addColorStop(0, `hsl(${shift + 300}, 95%, 72%)`);
        g.addColorStop(0.5, `hsl(${shift + 40}, 100%, 72%)`);
        g.addColorStop(1, `hsl(${shift + 180}, 85%, 72%)`);
        return g;
      },
    },
  });

  function addConfetti(n, fromTop) {
    const colours = ['#ffd27a', '#ff9ad5', '#ffffff', '#c9a5ff', '#ffb15a', '#7ee0c3', '#ff6f91'];
    for (let i = 0; i < n; i++) {
      confetti.push({
        x: Math.random() * W,
        y: fromTop ? -20 - Math.random() * H * 0.3 : H * 0.3 + (Math.random() - 0.5) * H * 0.2,
        vx: (Math.random() - 0.5) * 3, vy: fromTop ? 1 + Math.random() * 2 : -4 - Math.random() * 5,
        w: 6 + Math.random() * 7, h: 10 + Math.random() * 10,
        rot: Math.random() * 6.3, vr: (Math.random() - 0.5) * 0.3,
        sway: Math.random() * 6.3, col: colours[i % colours.length],
      });
    }
  }

  const drops = [];     // splash droplets
  const sparkles = [];  // tap sparkles
  const ripples = [];   // tap ripples on the water
  let time = 0;

  function leap(cx, peak, quiet) {
    if (dolphins.length >= (party.active ? 26 : 7)) return false;
    const span = size * (2.6 + Math.random() * 0.6);
    const dir = Math.random() < 0.5 ? -1 : 1;
    const maxPeak = waterY - size * 0.35;
    peak = Math.max(size * 0.55, Math.min(peak, maxPeak));
    const dive = size * 0.55; // how far below the surface the dolphin starts/ends
    const k = dive / (peak + dive);
    // Only jumps from a tap can be the pink dolphin, so she stays special
    // (the party's own leaps are always purple)
    const pink = !quiet && (++sincePink >= PINK_AT_LEAST_EVERY || Math.random() < PINK_CHANCE);
    if (pink) sincePink = 0;
    dolphins.push({
      x0: cx - dir * span / 2, x1: cx + dir * span / 2,
      peak, dive, p: 0, dur: 1.5 + peak / H * 1.2,
      dir, skin: pink ? PINK : SKINS[Math.floor(Math.random() * SKINS.length)], pink,
      pIn: (1 - Math.sqrt(1 - k)) / 2, pOut: (1 + Math.sqrt(1 - k)) / 2,
      inDone: false, outDone: false, quiet: !!quiet,
    });
    return true;
  }

  function dolphinPos(d, p) {
    const x = d.x0 + (d.x1 - d.x0) * p;
    const y = waterY + d.dive - (d.peak + d.dive) * 4 * p * (1 - p);
    return { x, y };
  }

  function splash(x, y, big, quiet) {
    const n = big ? 22 : 12;
    for (let i = 0; i < n; i++) {
      const a = -Math.PI / 2 + (Math.random() - 0.5) * 1.5;
      const s = (big ? 5 : 3) + Math.random() * (big ? 7 : 4);
      drops.push({ x: x + (Math.random() - 0.5) * 30, y, vx: Math.cos(a) * s * 0.8, vy: Math.sin(a) * s, r: 2 + Math.random() * 3.5, life: 1 });
    }
    ripples.push({ x, y: y + 4, r: 6, life: 1 });
    splashSound(quiet ? 0.05 : (big ? 0.2 : 0.12));
  }

  // A dolphin pops its head up, has a look around, then sinks back down
  function peek() {
    if (peeks.length) return;
    peeks.push({
      x: W * (0.15 + Math.random() * 0.7), t: 0, dur: 3.2,
      dir: Math.random() < 0.5 ? -1 : 1,
      skin: SKINS[Math.floor(Math.random() * SKINS.length)],
      up: false, down: false,
    });
  }

  function smallSplash(x, y, vol) {
    for (let i = 0; i < 9; i++) {
      const a = -Math.PI / 2 + (Math.random() - 0.5) * 1.3;
      const sp = 2 + Math.random() * 3;
      drops.push({ x: x + (Math.random() - 0.5) * 20, y, vx: Math.cos(a) * sp * 0.8, vy: Math.sin(a) * sp, r: 1.5 + Math.random() * 2.5, life: 0.8 });
    }
    ripples.push({ x, y: y + 4, r: 5, life: 0.8 });
    if (vol) plopSound(vol);
  }

  function drawPeek(pk, dt) {
    pk.t += dt;
    const t = pk.t, rise = 0.45, sink = 0.6;
    const ease = v => 1 - (1 - v) * (1 - v);
    let r = 1;
    if (t < rise) r = ease(t / rise);
    else if (t > pk.dur - sink) r = 1 - ease((t - (pk.dur - sink)) / sink);
    r = Math.max(0, r);

    if (!pk.up && t >= 0.12) { pk.up = true; smallSplash(pk.x, waterY, 0.09); }
    if (!pk.down && t >= pk.dur - 0.25) { pk.down = true; smallSplash(pk.x, waterY, 0.04); }

    const s = size / 226;
    const ang = -1.2 + Math.sin(t * 2.5) * 0.08;     // tilted up, with a little nod
    const bob = Math.sin(t * 4) * 3 * r;              // gentle bobbing while up
    const depth = (160 - 125 * r - bob) * 0.93 * s;    // how far the body sits below the surface
    ctx.save();
    // hide the rest of the body, cutting it off under the front waves so the
    // edge doesn't show
    ctx.beginPath(); ctx.rect(0, 0, W, waterY + H * 0.035); ctx.clip();
    ctx.translate(pk.x - pk.dir * 25 * s, waterY + depth);
    ctx.scale(pk.dir, 1); ctx.rotate(ang); ctx.scale(s, s);
    drawDolphin(ctx, pk.skin, 0);
    ctx.restore();
  }

  function sparkleBurst(x, y) {
    const colours = ['#ffd27a', '#ff9ad5', '#ffffff', '#c9a5ff', '#ffb15a'];
    for (let i = 0; i < 18; i++) {
      const a = Math.random() * Math.PI * 2, s = 1 + Math.random() * 5;
      sparkles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 1, r: 5 + Math.random() * 8, life: 1, rot: Math.random() * 3, col: colours[i % colours.length] });
    }
  }

  // One small, slow sparkle for the pink dolphin's trail
  function sparkleTrail(x, y) {
    const colours = ['#ff9ad5', '#ffffff', '#ffd27a', '#ffc2e6'];
    sparkles.push({
      x, y, vx: (Math.random() - 0.5) * 1.2, vy: (Math.random() - 0.5) * 1.2,
      r: 3 + Math.random() * 6, life: 0.9, rot: Math.random() * 3,
      col: colours[Math.floor(Math.random() * colours.length)],
    });
  }

  function starPath(c, r) {
    c.beginPath();
    for (let i = 0; i < 8; i++) {
      const rad = i % 2 ? r * 0.3 : r, a = (Math.PI / 4) * i - Math.PI / 2;
      c[i ? 'lineTo' : 'moveTo'](Math.cos(a) * rad, Math.sin(a) * rad);
    }
    c.closePath();
  }

  // ---------- Scenery ----------
  function drawSky() {
    const g = ctx.createLinearGradient(0, 0, 0, seaY);
    g.addColorStop(0, '#2d1458');
    g.addColorStop(0.45, '#7a2f95');
    g.addColorStop(0.78, '#e0508f');
    g.addColorStop(1, '#ffb25a');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, seaY + 2);

    // sun, half sunk in the sea
    const sx = W * 0.5, sy = seaY - H * 0.015, sr = Math.min(W, H) * 0.17;
    const glow = ctx.createRadialGradient(sx, sy, sr * 0.3, sx, sy, sr * 3.2);
    glow.addColorStop(0, 'rgba(255,214,130,0.85)'); glow.addColorStop(1, 'rgba(255,170,90,0)');
    ctx.fillStyle = glow; ctx.fillRect(0, 0, W, seaY + 2);
    ctx.fillStyle = '#ffe3a0';
    ctx.beginPath(); ctx.arc(sx, sy, sr, Math.PI, 0); ctx.fill();

    drawClouds();
  }

  // ---------- Clouds ----------
  // Soft clouds drift slowly across the sky, each made of a few puffs that
  // gently grow, shrink and shift, so the clouds slowly change shape.
  // Sizes and positions are fractions of the screen, so they fit any phone.
  const CLOUD_SPEED = 0.008;   // screen widths per second (about 2 minutes to cross)
  const CLOUD_MORPH = 1;       // how quickly they change shape (2 = twice as fast)
  const rand = (a, b) => a + Math.random() * (b - a);
  const clouds = [0.22, 0.36, 0.5, 0.64, 0.78].map(y => {
    const n = 3 + Math.floor(Math.random() * 3);   // 3 to 5 puffs
    return {
      start: Math.random(),                          // where across the sky it begins
      y: y + rand(-0.04, 0.04),                      // height, as a fraction of the sky
      speed: CLOUD_SPEED * rand(0.7, 1.3),
      puffs: Array.from({ length: n }, (_, j) => ({
        dx: (j - (n - 1) / 2) * rand(0.06, 0.09),    // spread out left to right
        dy: rand(-0.008, 0.004),
        rx: rand(0.06, 0.11), ry: rand(0.011, 0.02),
        phase: rand(0, 6.3), rate: rand(0.12, 0.3),  // each puff changes at its own pace
      })),
    };
  });

  function drawClouds() {
    ctx.fillStyle = 'rgba(255,170,200,0.28)';
    for (const c of clouds) {
      // drift left to right, wrapping round once fully off the screen
      const cx = (((c.start + time * c.speed) % 1.7) - 0.35) * W, cy = seaY * c.y;
      ctx.beginPath();
      for (const p of c.puffs) {
        const t = time * p.rate * CLOUD_MORPH + p.phase;
        const grow = 1 + Math.sin(t) * 0.3;          // puffs swell and shrink
        const px = cx + (p.dx + Math.sin(t * 0.7) * 0.02) * W;   // and drift a little within the cloud
        const py = cy + (p.dy + Math.cos(t * 0.8) * 0.005) * H;
        const rx = p.rx * W * grow, ry = p.ry * H * (0.85 + grow * 0.15);
        ctx.moveTo(px + rx, py);                     // each puff its own outline
        ctx.ellipse(px, py, rx, ry, 0, 0, Math.PI * 2);
      }
      ctx.fill();   // one shape, so overlapping puffs don't look darker
    }
  }

  function waveLine(base, amp, freq, speed, phase, fillStyle, topOnly) {
    ctx.beginPath();
    ctx.moveTo(0, H);
    for (let x = 0; x <= W + 8; x += 8) {
      ctx.lineTo(x, base + Math.sin(x * freq + time * speed + phase) * amp + Math.sin(x * freq * 2.3 + time * speed * 1.4) * amp * 0.4);
    }
    ctx.lineTo(W, H); ctx.closePath();
    ctx.fillStyle = fillStyle; ctx.fill();
  }

  function drawSeaBack() {
    const g = ctx.createLinearGradient(0, seaY, 0, H);
    g.addColorStop(0, '#d9609a'); g.addColorStop(0.15, '#8a3fa8'); g.addColorStop(0.55, '#4a2386'); g.addColorStop(1, '#25104f');
    ctx.fillStyle = g; ctx.fillRect(0, seaY, W, H - seaY);

    // golden shimmer under the sun
    for (let i = 0; i < 16; i++) {
      const y = seaY + 6 + i * (waterY - seaY) / 12 + (i > 12 ? (i - 12) * 14 : 0);
      const w = (W * 0.18) * (1 + i * 0.12) * (0.6 + 0.4 * Math.sin(time * 1.5 + i));
      ctx.fillStyle = `rgba(255,214,130,${Math.max(0, 0.55 - i * 0.03)})`;
      ctx.fillRect(W * 0.5 - w / 2, y, w, Math.max(2, H * 0.004));
    }
    waveLine(seaY + H * 0.045, H * 0.008, 0.02, 0.9, 0, 'rgba(120,50,150,0.45)');
  }

  function drawSeaFront() {
    waveLine(waterY - H * 0.005, H * 0.012, 0.016, 1.1, 1.0, 'rgba(92,40,150,0.80)');
    waveLine(waterY + H * 0.045, H * 0.014, 0.012, 0.8, 2.4, 'rgba(60,26,112,0.85)');
    waveLine(waterY + H * 0.11, H * 0.016, 0.010, 0.6, 4.0, 'rgba(37,16,79,0.95)');
  }

  // ---------- Main loop ----------
  let last = performance.now(), nextAuto = 1.2;
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now; time += dt;

    // every few seconds a dolphin pops its head up, so something is always
    // happening. Dolphins only leap when the screen is tapped.
    nextAuto -= dt;
    if (nextAuto <= 0) {
      peek();
      nextAuto = 3.5 + Math.random() * 3;
    }

    party.update(dt);

    drawSky(); drawSeaBack();

    // dolphins popping up (behind the front waves too)
    for (let i = peeks.length - 1; i >= 0; i--) {
      drawPeek(peeks[i], dt);
      if (peeks[i].t >= peeks[i].dur) peeks.splice(i, 1);
    }

    // dolphins (behind the front waves, so they rise out of the water)
    for (let i = dolphins.length - 1; i >= 0; i--) {
      const d = dolphins[i];
      d.p += dt / d.dur;
      if (!d.inDone && d.p >= d.pIn) {
        d.inDone = true; const q = dolphinPos(d, d.pIn); splash(q.x, waterY, true, d.quiet);
        if (d.pink) happyTrill();
      }
      if (!d.outDone && d.p >= d.pOut) { d.outDone = true; const q = dolphinPos(d, d.pOut); splash(q.x, waterY, false, d.quiet); }
      if (d.p >= 1) { dolphins.splice(i, 1); continue; }
      const p = d.p, pos = dolphinPos(d, p);
      const vy = -(d.peak + d.dive) * 4 * (1 - 2 * p), vx = Math.abs(d.x1 - d.x0);
      const ang = Math.atan2(vy, vx);
      ctx.save();
      ctx.translate(pos.x, pos.y); ctx.scale(d.dir, 1); ctx.rotate(ang);
      const s = size / 226; ctx.scale(s, s);
      drawDolphin(ctx, d.skin, 0);
      ctx.restore();
      // the pink dolphin leaves a trail of sparkles while she's out of the water
      if (d.pink && d.inDone && !d.outDone && Math.random() < 0.6) {
        const along = -20 - Math.random() * 85, across = (Math.random() - 0.5) * 30;   // from her middle back to her tail
        const cos = Math.cos(ang), sin = Math.sin(ang);
        sparkleTrail(pos.x + d.dir * (cos * along - sin * across) * s, pos.y + (sin * along + cos * across) * s);
      }
    }

    drawSeaFront();

    // ripples
    for (let i = ripples.length - 1; i >= 0; i--) {
      const r = ripples[i]; r.r += 90 * dt; r.life -= dt * 1.1;
      if (r.life <= 0) { ripples.splice(i, 1); continue; }
      ctx.strokeStyle = `rgba(255,220,170,${r.life * 0.7})`; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.ellipse(r.x, r.y, r.r, r.r * 0.28, 0, 0, 6.3); ctx.stroke();
    }
    // droplets
    for (let i = drops.length - 1; i >= 0; i--) {
      const d = drops[i]; d.vy += 14 * dt * 6; d.x += d.vx * dt * 60; d.y += d.vy * dt * 60 * 0.5; d.life -= dt * 1.4;
      if (d.life <= 0) { drops.splice(i, 1); continue; }
      ctx.fillStyle = `rgba(255,236,210,${Math.min(1, d.life * 1.4)})`;
      ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, 6.3); ctx.fill();
    }
    // sparkles
    for (let i = sparkles.length - 1; i >= 0; i--) {
      const s = sparkles[i]; s.x += s.vx; s.y += s.vy; s.vy += 0.06; s.rot += 0.08; s.life -= dt * 1.2;
      if (s.life <= 0) { sparkles.splice(i, 1); continue; }
      ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(s.rot);
      ctx.globalAlpha = Math.min(1, s.life * 1.5); ctx.fillStyle = s.col;
      starPath(ctx, s.r); ctx.fill(); ctx.restore();
    }

    // confetti
    for (let i = confetti.length - 1; i >= 0; i--) {
      const c = confetti[i];
      c.vy = Math.min(c.vy + 9 * dt, 3.5); c.sway += dt * 4;
      c.x += (c.vx + Math.sin(c.sway) * 1.2) * dt * 60; c.y += c.vy * dt * 60; c.rot += c.vr;
      if (c.y > H + 30) { confetti.splice(i, 1); continue; }
      ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.rot);
      ctx.scale(1, Math.cos(c.sway * 1.5));   // flutters as it turns
      ctx.fillStyle = c.col; ctx.fillRect(-c.w / 2, -c.h / 2, c.w, c.h);
      ctx.restore();
    }

    party.draw(ctx, W, H);

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(t => { last = t; frame(t); });

  // ---------- Tapping ----------
  document.addEventListener('pointerdown', ev => {
    ev.preventDefault();
    ensureAudio(); keepAwake();
    const x = ev.clientX, y = ev.clientY;
    // the dolphin leaps up to roughly where she tapped
    const leapt = leap(x, waterY - y + size * 0.15, false);
    // count the jump (not during a party), and start a party at 20
    if (leapt) party.add();
    sparkleBurst(x, y);
    chirp();
    if (navigator.vibrate) navigator.vibrate(15);
  });
</script>
<script>
  // Save the game on the phone so it works with no signal (see sw.js and
  // engine/sw.js). This stays in the page rather than the engine, so it still
  // runs on a poor signal even if the engine files fail to download.
  if ('serviceWorker' in navigator) {
    const save = () => navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).catch(() => {});
    window.addEventListener('load', save);
    window.addEventListener('online', save);   // signal back? try again
  }
  // Ask the phone not to clear the saved copy when it's short on space.
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
</script>
</body>
</html>
