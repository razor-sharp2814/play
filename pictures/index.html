<style>
  body { background: #26223f; color: #fff; font-family: Raleway, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  [hidden] { display: none !important; }
  .screen { position: fixed; inset: 0; }

  /* ---------- No pictures yet ----------
     Uses the settings' colours, font and dotted page (.gs-page in engine.css) */
  #empty {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 20px; padding: 24px; text-align: center;
  }
  #empty svg { width: min(56vw, 40vh, 240px); height: auto; }
  #empty h1 { margin: 0; font-size: 30px; line-height: 1.2; font-weight: 700; }
  #empty p { margin: 0; max-width: 21em; color: var(--gs-soft); font-size: 18px; line-height: 1.55; }
  /* the settings button, a little darker so it shows on the light page */
  @media (prefers-color-scheme: light) {
    #empty:not([hidden]) ~ .gs-hold { background: rgba(63, 63, 70, 0.12); color: rgba(63, 63, 70, 0.7); }
    #empty:not([hidden]) ~ .gs-hold .gs-hold-ring { stroke: #3f3f46; }
  }

  /* ---------- Choosing an album ---------- */
  #albums {
    display: grid; align-content: center; justify-content: center;
    gap: var(--gap); padding: calc(env(safe-area-inset-top, 0px) + 72px) 16px calc(env(safe-area-inset-bottom, 0px) + 24px);
  }
  .album {
    display: flex; flex-direction: column; gap: 8%;
    width: var(--tile); height: var(--tile); padding: 6% 6% 4%; box-sizing: border-box;
    border: 0; border-radius: 6%;
    background: #fffaf0; color: #3b3360;
    box-shadow: 0 10px 24px rgba(0, 0, 0, 0.35);
    font: inherit; font-size: calc(var(--tile) * 0.1); line-height: 1.1;
    transition: transform 0.15s ease-out;
  }
  .album:nth-child(3n+1) { transform: rotate(-2deg); }
  .album:nth-child(3n+2) { transform: rotate(1.5deg); }
  .album:nth-child(3n) { transform: rotate(-0.5deg); }
  .album.pressed { transform: scale(0.94); }
  .album img { flex: 1; min-height: 0; width: 100%; object-fit: cover; border-radius: 3%; background: #ddd6c6; }
  .album span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ---------- Looking at pictures ---------- */
  #viewer { overflow: hidden; background: #000; }
  #track { position: absolute; inset: 0; will-change: transform; }
  #track.moving { transition: transform 0.28s cubic-bezier(0.2, 0.7, 0.3, 1); }
  .slide { position: absolute; top: 0; width: 100%; height: 100%; overflow: hidden; }
  .slide .bg {
    position: absolute; inset: -10%; width: 120%; height: 120%;
    object-fit: cover; filter: blur(28px) brightness(0.55) saturate(1.2);
  }
  .slide .photo {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: contain;
    opacity: 0; transition: opacity 0.2s;
  }
  .slide .photo.ready { opacity: 1; }

  /* back to the albums, top left */
  #home {
    position: fixed; z-index: 10;
    top: calc(env(safe-area-inset-top, 0px) + 10px);
    left: calc(env(safe-area-inset-left, 0px) + 10px);
    width: 64px; height: 64px; padding: 14px; box-sizing: border-box;
    border: 0; border-radius: 50%;
    background: rgba(0, 0, 0, 0.35); color: #fff;
    transition: transform 0.15s ease-out;
  }
  #home.pressed { transform: scale(0.9); }
  #home svg { display: block; width: 100%; height: 100%; fill: currentColor; }

  /* previous and next arrows, only on a computer with a mouse (on a phone,
     swiping and tapping do the job) */
  .arrow { display: none; }
  @media (hover: hover) and (pointer: fine) {
    .arrow {
      display: block; position: fixed; z-index: 10; top: 50%;
      width: 64px; height: 64px; margin-top: -32px; padding: 16px; box-sizing: border-box;
      border: 0; border-radius: 50%;
      background: rgba(0, 0, 0, 0.35); color: #fff;
      cursor: pointer; opacity: 0.6;
      transition: opacity 0.2s, transform 0.15s ease-out;
    }
    .arrow:hover { opacity: 1; }
    .arrow.pressed { transform: scale(0.9); }
    .arrow svg { display: block; width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    #prev { left: calc(env(safe-area-inset-left, 0px) + 16px); }
    #next { right: calc(env(safe-area-inset-right, 0px) + 16px); }
    .album, #home { cursor: pointer; }
    .album:hover { box-shadow: 0 14px 32px rgba(0, 0, 0, 0.5); }
  }
  .arrow[hidden] { display: none; }

  /* ---------- Settings (shared parts are in engine.css) ---------- */
  .pic-thumb {
    width: 60px; height: 60px; flex: none; border-radius: 12px; object-fit: cover; background: var(--gs-line);
    outline: 2px solid var(--gs-ink); outline-offset: -2px;
  }
  .pic-grow { flex: 1; min-width: 0; }
  .pic-grow strong { display: block; font-weight: 700; font-size: 19px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pic-grow small { color: var(--gs-soft); font-size: 16px; }
  .gs-button.pic-back {
    min-height: 44px; padding: 0; border: 0; background: none;
    text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 4px;
  }
  .gs-button.pic-back:hover:not(:disabled) { background: none; color: var(--gs-accent); }
  .pic-actions { display: flex; flex-wrap: wrap; gap: 14px; margin: 14px 0; }
  .pic-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 12px; margin-top: 14px; }
  .pic-grid button {
    position: relative; aspect-ratio: 1; padding: 0; overflow: hidden; cursor: pointer;
    border: 2px solid var(--gs-ink); border-radius: 12px; background: var(--gs-line);
  }
  .pic-grid img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .pic-grid button.picked { border-color: var(--gs-accent); box-shadow: 0 0 0 2px var(--gs-accent); }
  .pic-grid button.picked img { opacity: 0.6; }
  .pic-grid button.picked::after {
    content: "✓"; position: absolute; top: 6px; right: 6px; width: 28px; height: 28px; border-radius: 50%;
    background: var(--gs-sticker-2); color: var(--gs-zinc-900); border: 2px solid var(--gs-ink);
    font: 700 15px/24px system-ui, sans-serif; text-align: center;
  }
  .pic-progress { font-weight: 700; color: var(--gs-text); }
  .pic-label { display: block; margin: 0 0 10px; font-size: 22px; font-weight: 600; }
</style>
</head>
<body>

<div id="empty" class="screen gs-page" hidden>

    <g clip-path="url(#empty-scene)">

  <p id="empty-note">Grown-ups: press and hold the grey button in the top corner to choose some pictures.</p>

<div id="albums" class="screen" hidden></div>

<div id="viewer" class="screen" hidden>
  <div id="track"></div>
  <button id="prev" class="arrow" type="button" aria-label="Previous picture"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M20 6 10 16l10 10"/></svg></button>
  <button id="next" class="arrow" type="button" aria-label="Next picture"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M12 6l10 10-10 10"/></svg></button>
  <button id="home" type="button" aria-label="All albums" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="2" width="9" height="9" rx="2.5"/><rect x="13" y="2" width="9" height="9" rx="2.5"/><rect x="2" y="13" width="9" height="9" rx="2.5"/><rect x="13" y="13" width="9" height="9" rx="2.5"/></svg>
  </button>
</div>

<script type="module">
  import { startGame, keepAwake } from '../engine/core.js';
  import { audio, ensureAudio, tone, vary } from '../engine/audio.js';
  import { createTapGuard } from '../engine/taps.js';
  import { createSettings } from '../engine/settings.js';

  startGame();
  const $ = id => document.getElementById(id);
  const taps = createTapGuard();

  // ---------- Where the pictures are kept ----------
  // In this site's storage on the phone (IndexedDB). Nothing is uploaded.
  //   albums: { id, name }
  //   photos: { id, album, full, thumb }   (full and thumb are JPEG Blobs)
  // Ids count up, so pictures come out in the order they were added.
  const FULL_SIZE = 2048, THUMB_SIZE = 400;   // longest side, in pixels

  let db = null;
  function request(r) {
    return new Promise((resolve, reject) => { r.onsuccess = () => resolve(r.result); r.onerror = () => reject(r.error); });
  }
  function openStore() {
    const r = indexedDB.open('pictures', 1);
    r.onupgradeneeded = () => {
      const d = r.result;
      d.createObjectStore('albums', { keyPath: 'id', autoIncrement: true });
      d.createObjectStore('photos', { keyPath: 'id', autoIncrement: true }).createIndex('album', 'album');
    };
    return request(r);
  }
  const store = (name, mode = 'readonly') => db.transaction(name, mode).objectStore(name);
  const done = tx => new Promise((resolve, reject) => { tx.oncomplete = resolve; tx.onerror = tx.onabort = () => reject(tx.error); });

  const listAlbums = () => request(store('albums').getAll());
  const photoIds = album => request(store('photos').index('album').getAllKeys(album));
  const getPhoto = id => request(store('photos').get(id));
  const saveAlbum = album => request(store('albums', 'readwrite').put(album));
  async function removePhotos(ids) {
    const tx = db.transaction('photos', 'readwrite');
    ids.forEach(id => tx.objectStore('photos').delete(id));
    await done(tx);
  }
  async function removeAlbum(id) {
    await removePhotos(await photoIds(id));
    await request(store('albums', 'readwrite').delete(id));
  }

  // Each album with its pictures, leaving out empty ones (nothing to look at).
  async function albumsWithPictures() {
    const out = [];
    for (const a of await listAlbums()) {
      const ids = await photoIds(a.id);
      if (ids.length) out.push({ ...a, ids });
    }
    return out;
  }

  // Picture links for <img>, made from what's stored. Made when needed and
  // let go of when not, so a big album doesn't fill the phone's memory.
  const links = new Map();   // "id/full" -> object URL
  async function link(id, size) {
    const key = `${id}/${size}`;
    if (!links.has(key)) {
      const p = await getPhoto(id);
      if (!p) return '';
      if (!links.has(key)) links.set(key, URL.createObjectURL(p[size]));
    }
    return links.get(key);
  }
  function forgetLinks(keep) {
    for (const [key, url] of links) if (!keep.has(key)) { URL.revokeObjectURL(url); links.delete(key); }
  }

  // ---------- Adding pictures ----------
  // Each picture is shrunk to screen size and saved fresh as a JPEG. That
  // keeps it small, and leaves behind the details hidden inside the original
  // (where it was taken, the camera, and so on).
  function decode(file) {
    return new Promise((resolve, reject) => {
      const img = new Image(), url = URL.createObjectURL(file);
      img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error(`can't read ${file.name}`)); };
      img.src = url;   // <img> turns photos the right way up by itself
    });
  }
  function shrink(img, max, quality) {
    const w = img.naturalWidth, h = img.naturalHeight, s = Math.min(1, max / Math.max(w, h));
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(w * s)); c.height = Math.max(1, Math.round(h * s));
    const g = c.getContext('2d');
    g.imageSmoothingQuality = 'high';
    g.drawImage(img, 0, 0, c.width, c.height);
    return new Promise((resolve, reject) => c.toBlob(b => (b ? resolve(b) : reject(new Error('shrink failed'))), 'image/jpeg', quality));
  }
  // Adds the files one at a time (gentler on the phone's memory). Calls
  // onProgress(doneSoFar, total) as it goes. Returns how many couldn't be read.
  async function addPictures(album, files, onProgress) {
    let failed = 0, n = 0;
    for (const file of files) {
      try {
        const img = await decode(file);
        const full = await shrink(img, FULL_SIZE, 0.85), thumb = await shrink(img, THUMB_SIZE, 0.8);
        await request(store('photos', 'readwrite').add({ album, full, thumb }));
      } catch (err) {
        if (err && err.name === 'QuotaExceededError') throw err;
        failed++;
      }
      onProgress(++n, files.length);
    }
    return failed;
  }

  // ---------- Sound ----------
  function swish(dir) {
    if (!audio) return;
    const f = vary(dir > 0 ? 660 : 520, 0.08);
    tone('sine', f, f * 1.5, 0, 0.18, 0.07);
    tone('sine', f * 1.5, f * 2, 0.07, 0.2, 0.05);
  }
  function boop() {
    if (!audio) return;
    tone('sine', vary(330, 0.1), 260, 0, 0.18, 0.08);
  }
  function pop() {
    if (!audio) return;
    const f = vary(500, 0.2);
    tone('triangle', f, f * 2, 0, 0.14, 0.12);
  }

  // ---------- What's on screen ----------
  let albums = [];          // albums with pictures, from albumsWithPictures()
  let current = null;       // the album being looked at
  let index = 0;            // which picture in it

  function show(screen) {
    for (const s of ['empty', 'albums', 'viewer']) $(s).hidden = s !== screen;
  }

  async function refresh() {
    try {
      albums = await albumsWithPictures();
    } catch (_) { albums = []; }
    if (!albums.length) { current = null; forgetLinks(new Set()); return show('empty'); }
    if (albums.length === 1) return openAlbum(albums[0], current && current.id === albums[0].id ? index : 0);
    if (current) {
      const same = albums.find(a => a.id === current.id);
      if (same) return openAlbum(same, index);
    }
    showAlbums();
  }

  // ---------- Choosing an album ----------
  function showAlbums() {
    current = null;
    show('albums');
    const grid = $('albums');
    // Pick the biggest tiles that fit every album on screen with no scrolling
    const W = innerWidth - 32, H = innerHeight - 96, n = albums.length, gap = 20;
    let best = 0, cols = 1;
    for (let c = 1; c <= n; c++) {
      const rows = Math.ceil(n / c);
      const size = Math.min((W - gap * (c - 1)) / c, (H - gap * (rows - 1)) / rows, 360);
      if (size > best) { best = size; cols = c; }
    }
    grid.style.setProperty('--tile', `${Math.floor(best)}px`);
    grid.style.setProperty('--gap', `${gap}px`);
    grid.style.gridTemplateColumns = `repeat(${cols}, auto)`;
    const keep = new Set();
    grid.replaceChildren(...albums.map(a => {
      const tile = document.createElement('button');
      tile.type = 'button';
      tile.className = 'album';
      tile.dataset.album = a.id;
      const img = document.createElement('img');
      img.alt = '';
      keep.add(`${a.ids[0]}/thumb`);
      link(a.ids[0], 'thumb').then(url => { img.src = url; });
      const name = document.createElement('span');
      name.textContent = a.name;
      tile.append(img, name);
      return tile;
    }));
    forgetLinks(keep);
  }
  $('albums').addEventListener('pointerdown', ev => {
    const tile = ev.target.closest('.album');
    if (!tile || !taps.accept(ev)) return;
    tile.classList.add('pressed');
    setTimeout(() => tile.classList.remove('pressed'), 150);
    pop();
    const album = albums.find(a => String(a.id) === tile.dataset.album);
    if (album) setTimeout(() => openAlbum(album, 0), 120);
  });
  window.addEventListener('resize', () => { if (!$('albums').hidden) showAlbums(); });

  // ---------- Looking at pictures ----------
  // Three slides side by side: the one before, this one and the next one.
  // The track slides left or right under the finger, then the slides are
  // shuffled round so the middle one is always the one on screen.
  const track = $('track');
  const slides = [0, 1, 2].map(() => {
    const el = document.createElement('div');
    el.className = 'slide';
    el.innerHTML = '<img class="bg" alt=""><img class="photo" alt="">';
    track.appendChild(el);
    return el;
  });
  const wrap = i => ((i % current.ids.length) + current.ids.length) % current.ids.length;

  async function fill(slide, i) {
    const id = current.ids[wrap(i)];
    slide.dataset.photo = id;
    const bg = slide.querySelector('.bg'), photo = slide.querySelector('.photo');
    photo.classList.remove('ready');
    const [thumb, full] = await Promise.all([link(id, 'thumb'), link(id, 'full')]);
    if (slide.dataset.photo !== String(id)) return;   // moved on while loading
    bg.src = thumb;
    photo.onload = () => photo.classList.add('ready');
    photo.src = full;
    if (photo.complete && photo.naturalWidth) photo.classList.add('ready');
  }
  function place() {
    slides.forEach((s, k) => { s.style.left = `${(k - 1) * 100}%`; });
  }
  function tidyLinks() {
    const keep = new Set();
    for (const d of [-1, 0, 1]) { const id = current.ids[wrap(index + d)]; keep.add(`${id}/full`); keep.add(`${id}/thumb`); }
    forgetLinks(keep);
  }

  function openAlbum(album, at) {
    current = album;
    index = Math.min(at, album.ids.length - 1);
    show('viewer');
    $('home').hidden = albums.length < 2;
    $('prev').hidden = $('next').hidden = album.ids.length < 2;
    track.classList.remove('moving');
    track.style.transform = '';
    place();
    slides.forEach((s, k) => fill(s, index + k - 1));
    tidyLinks();
  }

  let moving = false;
  // Move one picture along: dir is 1 for the next one, -1 for the one before.
  function go(dir) {
    if (moving || !current) return;
    if (current.ids.length < 2) { boop(); return settle(); }
    moving = true;
    swish(dir);
    track.classList.add('moving');
    track.style.transform = `translateX(${-dir * 100}%)`;
    const finish = () => {
      track.removeEventListener('transitionend', finish);
      clearTimeout(timer);
      index = wrap(index + dir);
      if (dir > 0) slides.push(slides.shift()); else slides.unshift(slides.pop());
      track.classList.remove('moving');
      track.style.transform = '';
      place();
      fill(dir > 0 ? slides[2] : slides[0], index + dir);
      tidyLinks();
      moving = false;
    };
    const timer = setTimeout(finish, 400);   // in case the end of the slide is missed
    track.addEventListener('transitionend', finish);
  }
  function settle() {
    track.classList.add('moving');
    track.style.transform = '';
  }

  // Swiping and tapping. Only the first finger down counts; a palm or a
  // handful of fingers is one tap (engine/taps.js).
  let drag = null;   // { id, x, y, t, dx }
  $('viewer').addEventListener('pointerdown', ev => {
    if (ev.target.closest('#home, .arrow')) return;
    const fresh = taps.accept(ev);
    if (drag || moving || !fresh) return;
    drag = { id: ev.pointerId, x: ev.clientX, y: ev.clientY, t: performance.now(), dx: 0 };
    track.classList.remove('moving');
  });
  document.addEventListener('pointermove', ev => {
    if (!drag || ev.pointerId !== drag.id) return;
    drag.dx = ev.clientX - drag.x;
    const pull = current && current.ids.length < 2 ? drag.dx * 0.25 : drag.dx;   // only one picture: a little give
    track.style.transform = `translateX(${pull}px)`;
  });
  function letGo(ev, cancelled) {
    if (!drag || ev.pointerId !== drag.id) return;
    const { dx, t } = drag, dy = ev.clientY - drag.y, ms = performance.now() - t;
    drag = null;
    if (cancelled) return settle();
    const flick = Math.abs(dx) > 30 && Math.abs(dx) / ms > 0.4;
    if (Math.abs(dx) > innerWidth * 0.2 || flick) go(dx < 0 ? 1 : -1);
    else if (Math.abs(dx) < 12 && Math.abs(dy) < 12) { settle(); go(1); }   // a tap: next picture
    else settle();
  }
  document.addEventListener('pointerup', ev => letGo(ev, false));
  document.addEventListener('pointercancel', ev => letGo(ev, true));

  // On a computer: the mouse wheel or the arrow keys
  let lastWheel = 0;
  document.addEventListener('wheel', ev => {
    if ($('viewer').hidden || performance.now() - lastWheel < 400 || Math.abs(ev.deltaX) + Math.abs(ev.deltaY) < 4) return;
    lastWheel = performance.now();
    go((Math.abs(ev.deltaX) > Math.abs(ev.deltaY) ? ev.deltaX : ev.deltaY) > 0 ? 1 : -1);
  }, { passive: true });
  document.addEventListener('keydown', ev => {
    if ($('viewer').hidden) return;
    if (ev.key === 'ArrowRight' || ev.key === ' ') go(1);
    else if (ev.key === 'ArrowLeft') go(-1);
    else if (ev.key === 'Escape' && albums.length > 1) showAlbums();
  });

  // The arrows, on a computer
  for (const [id, dir] of [['prev', -1], ['next', 1]]) {
    $(id).addEventListener('pointerdown', ev => {
      if (!taps.accept(ev)) return;
      $(id).classList.add('pressed');
      setTimeout(() => $(id).classList.remove('pressed'), 150);
      go(dir);
    });
  }

  // Back to the albums
  $('home').addEventListener('pointerdown', ev => {
    if (!taps.accept(ev)) return;
    $('home').classList.add('pressed');
    setTimeout(() => $('home').classList.remove('pressed'), 150);
    pop();
    setTimeout(showAlbums, 120);
  });

  // Every tap: wake the sound up and keep the screen on
  document.addEventListener('pointerdown', () => { ensureAudio(); keepAwake(); }, true);

  // ---------- Settings for grown-ups ----------
  const settings = createSettings({
    title: 'Pictures',
    onOpen: body => showAlbumList(body),
    onClose: refresh,
  });

  // Little helpers for building the settings
  function el(tag, props = {}, ...kids) {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(props)) {
      if (k === 'on') for (const [evName, fn] of Object.entries(v)) e.addEventListener(evName, fn);
      else if (k in e) e[k] = v; else e.setAttribute(k, v);
    }
    e.append(...kids);
    return e;
  }
  const plural = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`;
  // A button that asks "are you sure?" by needing a second tap
  function sureButton(label, sureLabel, action) {
    const b = el('button', { type: 'button', className: 'gs-button gs-danger', textContent: label });
    let timer;
    b.addEventListener('click', () => {
      if (!b.classList.contains('gs-sure')) {
        b.classList.add('gs-sure');
        b.textContent = sureLabel;
        timer = setTimeout(() => { b.classList.remove('gs-sure'); b.textContent = label; }, 4000);
        return;
      }
      clearTimeout(timer);
      action();
    });
    return b;
  }

  async function showAlbumList(body) {
    if (!db) {
      body.replaceChildren(el('p', { className: 'gs-note', textContent: "This browser won't let the game keep pictures. If it's a private or incognito window, open the game in a normal one." }));
      return;
    }
    const all = await listAlbums();
    const rows = await Promise.all(all.map(async a => {
      const ids = await photoIds(a.id);
      const thumb = el('img', { className: 'pic-thumb', alt: '' });
      if (ids.length) getPhoto(ids[0]).then(p => { if (p) { thumb.src = URL.createObjectURL(p.thumb); thumb.onload = () => URL.revokeObjectURL(thumb.src); } });
      return el('div', { className: 'gs-row' },
        thumb,
        el('div', { className: 'pic-grow' }, el('strong', { textContent: a.name }), el('small', { textContent: ids.length ? plural(ids.length, 'picture') : 'No pictures yet, so it’s hidden' })),
        el('button', { type: 'button', className: 'gs-button', textContent: 'Edit', on: { click: () => showAlbum(body, a.id) } }));
    }));
    let used = '';
    try {
      const est = await navigator.storage.estimate();
      if (est.usage) used = `Using ${Math.max(1, Math.round(est.usage / 1e6))} MB on this phone.`;
    } catch (_) {}
    body.replaceChildren(
      el('div', { className: 'gs-section' },
        el('h3', { className: 'gs-heading', textContent: 'Albums' }),
        ...(rows.length ? rows : [el('p', { className: 'gs-note', textContent: 'Make an album, then choose the pictures to go in it. With more than one album, little ones can choose which to look at.' })]),
        el('div', { className: 'pic-actions' },
          el('button', { type: 'button', className: 'gs-button gs-primary', textContent: 'New album', on: { click: newAlbum } }))),
      el('div', { className: 'gs-section' },
        el('h3', { className: 'gs-heading', textContent: 'Your pictures stay here' }),
        el('p', { className: 'gs-note', textContent: 'Pictures are copied into the game on this phone only. They’re never uploaded anywhere, and the details hidden inside photos, like where they were taken, are left out. Removing a picture here doesn’t touch your own photos.' }),
        ...(used ? [el('p', { className: 'gs-note', textContent: used })] : [])),
    );

    async function newAlbum() {
      const id = await saveAlbum({ name: `Album ${all.length + 1}` });
      showAlbum(body, id, true);
    }
  }

  async function showAlbum(body, albumId, isNew = false) {
    const album = await request(store('albums').get(albumId));
    if (!album) return showAlbumList(body);
    const ids = await photoIds(albumId);
    const picked = new Set();
    const urls = [];

    const name = el('input', { className: 'gs-input', type: 'text', value: album.name, maxLength: 40, autocomplete: 'off', id: 'pic-name' });
    name.addEventListener('change', () => { album.name = name.value.trim() || album.name; name.value = album.name; saveAlbum(album); });
    name.addEventListener('keydown', ev => { if (ev.key === 'Enter') name.blur(); });

    const files = el('input', { type: 'file', accept: 'image/*', multiple: true, hidden: true });
    const progress = el('p', { className: 'gs-note pic-progress', hidden: true });
    const add = el('button', { type: 'button', className: 'gs-button gs-primary', textContent: 'Add pictures', on: { click: () => files.click() } });
    files.addEventListener('change', async () => {
      const chosen = [...files.files];
      files.value = '';
      if (!chosen.length) return;
      add.disabled = true;
      progress.hidden = false;
      let message = '';
      try {
        const failed = await addPictures(albumId, chosen, (n, total) => { progress.textContent = `Adding ${n} of ${total}…`; });
        if (failed) message = `${plural(failed, 'picture')} couldn’t be read, so ${failed === 1 ? 'it was' : 'they were'} left out.`;
      } catch (_) {
        message = 'The phone ran out of room for more pictures. Some may not have been added.';
      }
      if (!settings.isOpen) return refresh();
      await showAlbum(body, albumId);
      if (message) { const p = body.querySelector('.pic-progress'); p.hidden = false; p.textContent = message; }
    });

    const remove = sureButton('Remove pictures', 'Tap again to remove', async () => {
      await removePhotos([...picked]);
      showAlbum(body, albumId);
    });
    const updateRemove = () => {
      remove.hidden = !picked.size;
      remove.classList.remove('gs-sure');
      remove.textContent = `Remove ${plural(picked.size, 'picture')}`;
    };

    const grid = el('div', { className: 'pic-grid' });
    for (const id of ids) {
      const img = el('img', { alt: '' });
      const b = el('button', { type: 'button', 'aria-pressed': 'false', 'aria-label': 'Picture' }, img);
      b.addEventListener('click', () => {
        picked.has(id) ? picked.delete(id) : picked.add(id);
        b.classList.toggle('picked', picked.has(id));
        b.setAttribute('aria-pressed', String(picked.has(id)));
        updateRemove();
      });
      grid.append(b);
      getPhoto(id).then(p => { if (p) { const u = URL.createObjectURL(p.thumb); urls.push(u); img.src = u; } });
    }
    // let go of the little pictures when this page is left
    const observer = new MutationObserver(() => { if (!grid.isConnected) { urls.forEach(u => URL.revokeObjectURL(u)); observer.disconnect(); } });
    observer.observe(body, { childList: true });

    body.replaceChildren(
      el('button', { type: 'button', className: 'gs-button pic-back', textContent: '‹ All albums', on: { click: () => showAlbumList(body) } }),
      el('div', { className: 'gs-section' },
        el('label', { className: 'pic-label', htmlFor: 'pic-name', textContent: 'Album name' }),
        name),
      el('div', { className: 'gs-section' },
        el('h3', { className: 'gs-heading', textContent: ids.length ? plural(ids.length, 'picture') : 'No pictures yet' }),
        el('div', { className: 'pic-actions' }, add, remove),
        progress,
        el('p', { className: 'gs-note', textContent: ids.length ? 'Tap pictures to choose which to remove. They play in the order they were added.' : 'Choose pictures from your phone. On Android, the picker usually shows your Google Photos albums too.' }),
        files,
        grid),
      el('div', { className: 'gs-section' },
        sureButton('Delete this album', 'Tap again to delete', async () => {
          await removeAlbum(albumId);
          showAlbumList(body);
        })),
    );
    updateRemove();
    if (isNew) { name.focus(); name.select(); }
  }

  // ---------- Start ----------
  try {
    db = await openStore();
  } catch (_) {
    $('empty-note').textContent = "This browser won't let the game keep pictures. If it's a private or incognito window, open the game in a normal one.";
  }
  await refresh();
</script>
<script>
  // Save the game on the phone so it works with no signal (see sw.js and
  // engine/sw.js). This stays in the page rather than the engine, so it still
  // runs on a poor signal even if the engine files fail to download.
  if ('serviceWorker' in navigator) {
    const save = () => navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).catch(() => {});
    window.addEventListener('load', save);
    window.addEventListener('online', save);   // signal back? try again
  }
  // Ask the phone not to clear the saved copy (and the pictures) when it's
  // short on space.
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
</script>
</body>
</html>
